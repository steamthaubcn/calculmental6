:root{
  --paper:#FBFCFE; --grid:#E2EAF6; --ink:#1B2A4A; --ink-2:#4A5878; --line:#C9D4E6; --surface:#FFFFFF;
  --blue:#1F5FD1; --blue-soft:#E6EEFC; --violet:#6B3FA0; --violet-soft:#F1EAF9;
  --green:#12735A; --green-soft:#E2F3EC; --amber:#8A5A00; --amber-soft:#FFF4CC;
  --hl:#FFE066; --hl-ink:#3B2F00; --red:#C2342B; --red-soft:#FBE8E6; --ok:#12735A; --ok-soft:#E2F3EC;
  --on-acc:#FFFFFF; --shadow:0 2px 0 rgba(27,42,74,.12);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121826; --grid:#1B2436; --ink:#E8EEF8; --ink-2:#A9B6CE; --line:#2E3A52; --surface:#1A2233;
    --blue:#86ADFF; --blue-soft:#1C2B4E; --violet:#C6A6F2; --violet-soft:#2A2142;
    --green:#62D3A8; --green-soft:#15332A; --amber:#FFD45C; --amber-soft:#3A3115;
    --hl:#FFD84D; --hl-ink:#2A2100; --red:#FF8F85; --red-soft:#3D1F1F; --ok:#62D3A8; --ok-soft:#15332A;
    --on-acc:#121826; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121826; --grid:#1B2436; --ink:#E8EEF8; --ink-2:#A9B6CE; --line:#2E3A52; --surface:#1A2233;
  --blue:#86ADFF; --blue-soft:#1C2B4E; --violet:#C6A6F2; --violet-soft:#2A2142;
  --green:#62D3A8; --green-soft:#15332A; --amber:#FFD45C; --amber-soft:#3A3115;
  --hl:#FFD84D; --hl-ink:#2A2100; --red:#FF8F85; --red-soft:#3D1F1F; --ok:#62D3A8; --ok-soft:#15332A;
  --on-acc:#121826; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; min-height:100vh; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:18px; line-height:1.5; -webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
}
button{ font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; }
button:focus-visible,input:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }
.wrap{ max-width:880px; margin:0 auto; padding:20px 18px 48px; }
h1,h2,h3{ line-height:1.2; margin:0; }
p{ margin:0; }
.muted{ color:var(--ink-2); }

/* Inici */
.hero{ padding:28px 0 22px; }
.hero h1{ font-size:clamp(2.2rem,6vw,3.4rem); letter-spacing:-.01em; }
.hero h1 .sq{ display:inline-block; background:var(--hl); color:var(--hl-ink); padding:0 .18em; border-radius:4px; transform:rotate(-1.5deg); }
.hero p{ margin-top:10px; max-width:52ch; color:var(--ink-2); }
.mods{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:12px; }
.mod{
  display:flex; gap:16px; align-items:center; text-align:left; padding:18px; min-height:104px;
  background:var(--surface); border:2px solid var(--line); border-left:8px solid var(--acc); border-radius:14px;
  box-shadow:var(--shadow); transition:transform .15s ease, border-color .15s ease;
}
.mod:hover{ transform:translateY(-2px); border-color:var(--acc); }
.mod:active{ transform:translateY(1px); }
.mod .ic{ flex:0 0 64px; height:64px; display:grid; place-items:center; border-radius:12px; background:var(--acc-soft); color:var(--acc); font-size:1.7rem; font-weight:700; }
.mod h2{ font-size:1.2rem; }
.mod p{ color:var(--ink-2); font-size:.95rem; }

/* Capçalera */
.top{ display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.back{ min-height:48px; padding:8px 16px; border-radius:12px; background:var(--surface); border:2px solid var(--line); font-weight:700; }
.top h1{ font-size:1.5rem; flex:1; min-width:180px; }
.tabs{ display:flex; gap:6px; background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:5px; margin-bottom:18px; }
.tab{ flex:1; min-height:52px; border:0; background:transparent; border-radius:10px; font-weight:700; color:var(--ink-2); transition:background .15s; }
.tab[aria-selected="true"]{ background:var(--acc); color:var(--on-acc); }

.panel{ background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:18px; }
.panel + .panel{ margin-top:14px; }
.panel h2{ font-size:1.15rem; margin-bottom:6px; }
.row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.chip{ min-height:48px; padding:8px 16px; border-radius:999px; border:2px solid var(--line); background:var(--surface); font-weight:700; }
.chip[aria-pressed="true"]{ background:var(--acc-soft); border-color:var(--acc); color:var(--ink); }
.chip[aria-pressed="true"]::before{ content:"✓ "; color:var(--acc); }
.btn{ min-height:56px; padding:10px 22px; border-radius:14px; border:2px solid transparent; font-weight:700; font-size:1.05rem; }
.btn.primary{ background:var(--acc); color:var(--on-acc); box-shadow:var(--shadow); }
.btn.ghost{ background:var(--surface); border-color:var(--line); }
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.label{ font-weight:700; margin:14px 0 8px; }
.hint{ color:var(--ink-2); font-size:.95rem; margin:6px 0 12px; }

/* Targetes per memoritzar */
.cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px; margin-top:12px; }
.card{ position:relative; min-height:84px; border-radius:12px; border:2px solid var(--line); background:var(--paper); padding:8px; perspective:600px; }
.card .in{ display:grid; place-items:center; height:100%; min-height:64px; transition:transform .35s ease; transform-style:preserve-3d; }
.card .f,.card .b{ grid-area:1/1; backface-visibility:hidden; font-size:1.55rem; font-weight:700; }
.card .b{ transform:rotateY(180deg); color:var(--acc); }
.card.on .in{ transform:rotateY(180deg); }
.card.on{ border-color:var(--acc); background:var(--acc-soft); }
sup{ font-size:.6em; line-height:0; }

/* Graella de primers */
.pgrid{ display:grid; grid-template-columns:repeat(10,1fr); gap:5px; margin-top:12px; }
.pn{ aspect-ratio:1; min-height:40px; border-radius:8px; border:2px solid var(--line); background:var(--paper); font-weight:700; font-size:clamp(.85rem,2.6vw,1.1rem); padding:0; transition:background .15s, transform .1s; }
.pn.prime{ background:var(--hl); color:var(--hl-ink); border-color:var(--hl); }
.pn.comp-shown{ color:var(--ink-2); text-decoration:line-through; text-decoration-thickness:2px; }
.pn.sel{ outline:3px solid var(--ink); outline-offset:1px; }
.info{ margin-top:12px; padding:14px; border-radius:12px; background:var(--paper); border:2px dashed var(--line); min-height:56px; }

/* Criteris */
.crit{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:10px; margin-top:10px; }
.cr{ border:2px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--paper); }
.cr h3{ font-size:1.05rem; color:var(--acc); }
.cr p{ font-size:.98rem; }
.cr .ex{ color:var(--ink-2); margin-top:4px; font-size:.92rem; }
.field{ display:flex; gap:8px; flex-wrap:wrap; }
.field input{ flex:1; min-width:160px; min-height:56px; font:inherit; font-size:1.4rem; font-weight:700; padding:8px 14px; border-radius:12px; border:2px solid var(--line); background:var(--paper); color:var(--ink); }
.err{ color:var(--red); font-weight:700; margin-top:8px; }
.res{ list-style:none; padding:0; margin:12px 0 0; display:grid; gap:8px; }
.res li{ padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:var(--paper); }
.res li.y{ border-color:var(--ok); background:var(--ok-soft); }
.res b{ display:block; }

/* Pràctica: tria de mode */
.modes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-top:8px; }
.modecard{ text-align:left; padding:16px; border-radius:14px; border:2px solid var(--line); background:var(--paper); min-height:96px; }
.modecard[aria-pressed="true"]{ border-color:var(--acc); background:var(--acc-soft); }
.modecard b{ display:block; font-size:1.1rem; }
.modecard span{ color:var(--ink-2); font-size:.95rem; }

/* Pregunta */
.qhead{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.qhead .count{ margin-left:auto; font-weight:700; color:var(--ink-2); }
.bar{ height:10px; border-radius:99px; background:var(--line); overflow:hidden; margin-bottom:16px; }
.bar > i{ display:block; height:100%; background:var(--acc); width:0; transition:width .3s ease; }
.bar.time > i{ transition:width .2s linear; }
.qcard{ background:var(--surface); border:2px solid var(--line); border-radius:18px; padding:20px 16px 22px; text-align:center; }
.qsub{ font-size:1.1rem; color:var(--ink-2); font-weight:700; }
.qbig{ font-size:clamp(3rem,12vw,5.2rem); font-weight:700; line-height:1.1; margin:10px 0 6px; letter-spacing:-.01em; }
.qbig.text{ font-size:clamp(1.8rem,6vw,2.6rem); }
.blank{ display:inline-block; min-width:.9em; padding:0 .12em; border:3px dashed var(--acc); border-radius:10px; color:var(--acc); }
.display{ margin:6px auto 0; min-height:74px; max-width:280px; display:grid; place-items:center; font-size:2.6rem; font-weight:700; border-radius:14px; border:3px solid var(--acc); background:var(--acc-soft); }
.display.empty::after{ content:"_"; color:var(--ink-2); animation:blink 1s steps(1) infinite; }
.display.shake{ animation:shake .35s; border-color:var(--red); }
@keyframes blink{ 50%{ opacity:0; } }
@keyframes shake{ 25%{ transform:translateX(-8px);} 75%{ transform:translateX(8px);} }
.pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:420px; margin:16px auto 0; }
.key{ min-height:64px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-size:1.6rem; font-weight:700; box-shadow:var(--shadow); }
.key:active{ transform:translateY(2px); box-shadow:none; background:var(--acc-soft); }
.key.go{ grid-column:1 / -1; background:var(--acc); color:var(--on-acc); border-color:var(--acc); font-size:1.25rem; }
.key.del{ font-size:1.25rem; }
.yn{ display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:460px; margin:18px auto 0; }
.yn .key{ min-height:84px; font-size:1.7rem; }
.opts{ display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:460px; margin:18px auto 0; }
.opts .key{ min-height:84px; font-size:2rem; }
.msg{ min-height:28px; margin-top:10px; color:var(--red); font-weight:700; }

/* Retroacció */
.fb{ margin-top:16px; border-radius:16px; padding:18px; border:3px solid; text-align:left; animation:pop .25s ease; }
.fb.ok{ border-color:var(--ok); background:var(--ok-soft); }
.fb.ko{ border-color:var(--red); background:var(--red-soft); }
.fb h3{ font-size:1.35rem; display:flex; gap:10px; align-items:center; }
.fb .mark{ display:inline-grid; place-items:center; width:40px; height:40px; border-radius:50%; font-size:1.4rem; color:var(--on-acc); }
.fb.ok .mark{ background:var(--ok); }
.fb.ko .mark{ background:var(--red); }
.fb .ans{ margin-top:6px; font-weight:700; }
.fb .ex{ margin-top:8px; }
.fb .btn{ margin-top:14px; width:100%; }
.flash{ margin-top:14px; font-weight:700; font-size:1.2rem; min-height:34px; animation:pop .2s ease; }
.flash.ok{ color:var(--ok); } .flash.ko{ color:var(--red); }
@keyframes pop{ from{ transform:scale(.96); opacity:0; } to{ transform:none; opacity:1; } }

/* Resultats */
.score{ text-align:center; padding:24px 16px; }
.score .big{ font-size:clamp(3rem,12vw,4.6rem); font-weight:700; color:var(--acc); line-height:1; }
.stats{ display:flex; justify-content:center; gap:24px; flex-wrap:wrap; margin-top:10px; color:var(--ink-2); }
.stats b{ color:var(--ink); }
.errs{ list-style:none; padding:0; margin:10px 0 0; display:grid; gap:10px; }
.errs li{ border:2px solid var(--line); border-left:6px solid var(--red); border-radius:12px; padding:12px 14px; background:var(--paper); }
.errs .q{ font-weight:700; font-size:1.1rem; }
.actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
.actions .btn{ flex:1; min-width:180px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

@media (max-width:520px){ body{ font-size:17px; } .wrap{ padding:14px 12px 40px; } .cards{ grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); } .card .f,.card .b{ font-size:1.3rem; } }
/* Xifres ressaltades als criteris */
:root{ --dg-last:#1F5FD1; --dg-last-soft:#DCE7FC; --dg-odd:#B4470C; --dg-odd-soft:#FDE6D6; --dg-even:#7A2E9E; --dg-even-soft:#F1E3F8; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --dg-last:#8DB4FF; --dg-last-soft:#1E2E52; --dg-odd:#FFAA70; --dg-odd-soft:#3E2716; --dg-even:#DDA8F5; --dg-even-soft:#33213F; } }
:root[data-theme="dark"]{ --dg-last:#8DB4FF; --dg-last-soft:#1E2E52; --dg-odd:#FFAA70; --dg-odd-soft:#3E2716; --dg-even:#DDA8F5; --dg-even-soft:#33213F; }
.dgn{ white-space:nowrap; font-weight:700; }
.dg{ font-weight:700; border-radius:.15em; padding:0 .05em; }
.dg.last{ color:var(--dg-last); background:var(--dg-last-soft); border-bottom:.12em solid var(--dg-last); }
.dg.odd{ color:var(--dg-odd); background:var(--dg-odd-soft); border-bottom:.12em solid var(--dg-odd); }
.dg.even{ color:var(--dg-even); background:var(--dg-even-soft); border-bottom:.12em dotted var(--dg-even); }
.legend{ display:flex; flex-wrap:wrap; gap:8px 18px; font-size:.95rem; color:var(--ink-2); margin:4px 0 10px; }
/* Exemples gràfics */
.vz{ margin:12px 0 0; padding:14px 12px; border-radius:12px; background:var(--surface); border:2px solid var(--line); overflow-x:auto; text-align:center; }
.vz figcaption{ margin-top:10px; font-size:.92rem; color:var(--ink-2); font-weight:700; }
.vz-sq{ display:inline-grid; grid-template-columns:auto auto; gap:4px 6px; align-items:center; justify-items:center; }
.vz-l{ font-weight:700; color:var(--acc); }
.vz-cells{ display:grid; gap:2px; }
.vz-cells i{ display:block; aspect-ratio:1; background:var(--acc-soft); border:1.5px solid var(--acc); border-radius:2px; }
.vz-blocks{ display:inline-grid; gap:4px; }
.vz .vz-blocks b{ display:grid; width:56px; height:56px; place-items:center; background:var(--acc-soft); border:2px solid var(--acc); border-radius:4px; font-size:.9rem; }
.vz-svg{ width:100%; max-width:340px; height:auto; display:block; margin:0 auto; overflow:visible; }
.vz-svg text{ text-anchor:middle; dominant-baseline:middle; fill:var(--ink); font-weight:700; font-size:17px; font-family:inherit; }
.vz-svg .s{ font-size:14px; }
.vz-svg .tb{ font-size:21px; fill:var(--acc); }
.vz-svg .ra{ fill:var(--acc-soft); stroke:var(--acc); stroke-width:2; }
.vz-svg .rb{ fill:var(--dg-odd-soft); stroke:var(--dg-odd); stroke-width:2; }
.vz-svg .ax{ stroke:var(--ink-2); stroke-width:2; }
.vz-svg .mk{ fill:var(--acc); }
.vz-svg .fc{ stroke:var(--ink); stroke-width:1.6; stroke-linejoin:round; fill:var(--acc); }
.vz-svg .f1{ fill-opacity:.55; } .vz-svg .f2{ fill-opacity:.32; } .vz-svg .f3{ fill-opacity:.14; }
.vz-svg .gl{ stroke:var(--ink); stroke-width:.8; stroke-opacity:.55; }
.vz-cube{ max-width:190px; margin:0; }
.vz-row{ display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:center; }
.vz-steps{ display:grid; gap:6px; text-align:left; }
.vz-steps span{ padding:6px 12px; border-radius:8px; background:var(--acc-soft); font-weight:700; }
.vz-chips{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; align-items:center; margin-top:10px; }
.vz-chip{ padding:3px 10px; border-radius:999px; border:2px solid var(--line); background:var(--paper); font-weight:700; font-size:.95rem; }
.vz-chip.on{ border-color:var(--ok); background:var(--ok-soft); }
.vz-chip.ko{ border-color:var(--red); border-style:dashed; background:var(--red-soft); }
.vz-note{ font-weight:700; font-size:.95rem; }
.vz-lab{ margin-top:8px; font-size:.92rem; color:var(--ink-2); }
.vz-dots{ display:inline-grid; gap:3px; margin-top:6px; }
.vz-dots i{ display:block; aspect-ratio:1; border-radius:50%; background:var(--acc); }
.vz-minis{ display:flex; flex-wrap:wrap; gap:16px; justify-content:center; align-items:end; }
.vz-mini{ display:grid; gap:4px; justify-items:center; font-size:.9rem; font-weight:700; }
.vz-boxes{ display:inline-flex; gap:4px; align-items:center; }
.vz-boxes.alt{ padding-top:18px; }
.vz-box{ position:relative; min-width:40px; height:48px; display:grid; place-items:center; border:2px solid var(--line); border-radius:8px; background:var(--paper); font-size:1.5rem; font-weight:700; }
.vz-box.last{ border-color:var(--dg-last); background:var(--dg-last-soft); color:var(--dg-last); border-bottom-width:5px; }
.vz-box.odd{ border-color:var(--dg-odd); background:var(--dg-odd-soft); color:var(--dg-odd); border-bottom-width:5px; }
.vz-box.even{ border-color:var(--dg-even); background:var(--dg-even-soft); color:var(--dg-even); border-bottom:5px dotted var(--dg-even); }
.vz-box small{ position:absolute; top:-19px; left:50%; transform:translateX(-50%); font-size:.7rem; color:var(--ink-2); white-space:nowrap; }
.vz em{ font-style:normal; font-weight:700; font-size:1.3rem; color:var(--ink-2); padding:0 2px; }
.vz-line{ display:flex; flex-wrap:wrap; gap:4px; align-items:center; justify-content:center; }
.vz-sum{ display:inline-grid; place-items:center; min-width:48px; height:48px; padding:0 8px; border-radius:24px; background:var(--acc); color:var(--on-acc); font-size:1.4rem; font-weight:700; }
.vz-sub{ padding:10px 8px; border-radius:10px; border:2px dashed var(--line); margin-top:8px; }
.vz-sub b{ display:block; margin-bottom:6px; }
.vz-pill{ padding:3px 12px; border-radius:999px; font-weight:700; border:2px solid var(--line); background:var(--paper); }
.vz-pill.odd{ color:var(--dg-odd); background:var(--dg-odd-soft); border-color:var(--dg-odd); }
.vz-pill.even{ color:var(--dg-even); background:var(--dg-even-soft); border:2px dotted var(--dg-even); }
.cr .vz{ padding:10px 8px; }
.cr .vz-box{ min-width:32px; height:40px; font-size:1.2rem; }
.vz-cube text{ font-size:20px; }
/* Definicions */
.def{ border-left:8px solid var(--acc); margin-bottom:14px; }
.def summary,.def-mini summary{ cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; min-height:44px; }
.def summary::-webkit-details-marker,.def-mini summary::-webkit-details-marker{ display:none; }
.def summary::after,.def-mini summary::after{ content:"▾"; margin-left:auto; font-size:1.2rem; color:var(--ink-2); transition:transform .2s; }
details[open] > summary::after{ transform:rotate(180deg); }
.def h2{ margin:0; font-size:1.3rem; }
.def-short{ font-size:1.2rem; font-weight:700; margin:10px 0 12px; padding:12px 14px; border-radius:12px; background:var(--acc-soft); }
.def-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px; margin-top:12px; }
.def-box{ border:2px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--paper); }
.def-box h3{ font-size:1rem; color:var(--acc); margin-bottom:6px; }
.def-box p + p{ margin-top:6px; }
.def-big{ font-size:1.45rem; font-weight:700; }
.def-box.warn{ border-color:var(--red); background:var(--red-soft); }
.def-box.warn h3{ color:var(--red); }
.def-words{ margin:0; display:grid; gap:2px; }
.def-words dt{ font-weight:700; }
.def-words dd{ margin:0 0 6px; color:var(--ink-2); }
.vz-chips.start{ justify-content:flex-start; }
.def-mini{ margin-bottom:14px; }
.def-mini summary{ font-weight:700; }
.def-mini p{ margin-top:8px; }
/* Logotip */
.brand{ max-width:880px; margin:0 auto; padding:16px 18px 0; }
.brand img{ display:block; height:60px; width:auto; background:#fff; border-radius:10px; padding:4px 8px; box-shadow:var(--shadow); }
@media (max-width:520px){ .brand{ padding:12px 12px 0; } .brand img{ height:46px; } }
/* Fitxes en paper */
.code{ display:inline-block; font-size:2.1rem; font-weight:700; letter-spacing:.08em; padding:8px 20px; border:3px dashed var(--acc); border-radius:12px; background:var(--acc-soft); margin:4px 0 8px; }
.plist{ list-style:none; padding:0; margin:14px 0 0; display:grid; gap:10px; }
.plist li{ border:2px solid var(--line); border-radius:12px; padding:12px; background:var(--paper); }
.plist li.ok{ border-left:6px solid var(--ok); }
.plist li.ko{ border-left:6px solid var(--red); }
.plist li.unread{ border:2px dashed var(--red); background:var(--red-soft); }
.pq{ display:flex; gap:12px; align-items:flex-start; }
.pq .n{ flex:0 0 36px; height:36px; border-radius:50%; display:grid; place-items:center; background:var(--acc); color:var(--on-acc); font-weight:700; }
.pp{ font-size:1.5rem; font-weight:700; line-height:1.2; }
.pp.t{ font-size:1.1rem; }
.pans{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0 0 48px; }
.pans input{ width:160px; min-height:52px; font:inherit; font-size:1.3rem; font-weight:700; padding:6px 12px; border-radius:10px; border:2px solid var(--line); background:var(--surface); color:var(--ink); }
.notice{ border:2px solid var(--amber); background:var(--amber-soft); border-radius:12px; padding:12px 14px; margin:10px 0; }
.check{ display:flex; gap:10px; align-items:flex-start; margin:14px 0; font-weight:700; cursor:pointer; }
.check input{ width:26px; height:26px; flex:0 0 26px; margin-top:1px; }
.filebtn{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
.filebtn:focus-within{ outline:3px solid var(--blue); outline-offset:2px; }
.preview{ display:block; max-width:100%; max-height:320px; border-radius:10px; border:2px solid var(--line); margin-top:10px; }
.ok-msg{ color:var(--ok); font-weight:700; margin-top:8px; }
details.exp summary{ cursor:pointer; color:var(--ink-2); font-weight:700; margin-top:6px; min-height:36px; }
@media (max-width:520px){ .pans{ margin-left:0; } }


@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

</style>

<main id="app"></main>
<script>
// ===== Lògica matemàtica =====
const fmt = n => { const s = String(n); return s.length > 3 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : s; };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isPrime = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const smallestFactor = n => { for (let i = 2; i * i <= n; i++) if (n % i === 0) return i; return n; };
const digitsOf = n => String(n).split('').map(Number);
const sum = a => a.reduce((x, y) => x + y, 0);
const listNi = a => a.length === 1 ? String(a[0]) : a.slice(0, -1).join(', ') + ' ni ' + a[a.length - 1];
const sumStr = a => a.length > 1 ? `${a.join(' + ')} = ${sum(a)}` : `${sum(a)}`;
// Article: l’1, l’11; el 2, el 37...
const art = n => (n === 1 || n === 11) ? `l’${n}` : `el ${n}`;
const Art = n => (n === 1 || n === 11) ? `L’${n}` : `El ${n}`;
// Ressalta xifres d’un nombre: 'last1' (l’última), 'last2' (les dues últimes), 'alt' (lloc senar/parell des de la dreta)
function dg(n, mode) {
  const s = fmt(n); let idx = 0, out = '';
  for (let i = s.length - 1; i >= 0; i--) {
    const c = s[i];
    if (c === '.') { out = c + out; continue; }
    let cls = '';
    if (mode === 'last1' && idx === 0) cls = 'last';
    else if (mode === 'last2' && idx < 2) cls = 'last';
    else if (mode === 'alt') cls = idx % 2 === 0 ? 'odd' : 'even';
    out = (cls ? `<span class="dg ${cls}">${c}</span>` : c) + out; idx++;
  }
  return `<span class="dgn">${out}</span>`;
}
const dgd = (v, cls) => `<span class="dg ${cls}">${v}</span>`;
const colSum = (a, cls) => a.length > 1 ? `${a.map(x => dgd(x, cls)).join(' + ')} = ${sum(a)}` : dgd(a[0], cls);
// ===== Exemples gràfics de les explicacions =====
const fig = (body, cap) => `<figure class="vz" aria-hidden="true">${body}${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
const cellGrid = (r, c, size) => `<div class="vz-cells" style="grid-template-columns:repeat(${c},${size}px)">${'<i></i>'.repeat(r * c)}</div>`;
const dotArray = (r, c, size) => `<div class="vz-dots" style="grid-template-columns:repeat(${c},${size}px)">${'<i></i>'.repeat(r * c)}</div>`;
const chip = (t, cls = '') => `<span class="vz-chip ${cls}">${t}</span>`;
function bestPair(n) { let a = 1; for (let i = 1; i * i <= n; i++) if (n % i === 0) a = i; return [a, n / a]; }
function arrDims(n) { const p = smallestFactor(n), q = n / p; return q <= 20 ? [p, q] : bestPair(n); }

// --- Quadrats ---
function sqViz(n) {
  const v = n * n;
  if (n <= 10) {
    return fig(`<div class="vz-sq"><span></span><span class="vz-l">${n}</span><span class="vz-l">${n}</span>${cellGrid(n, n, n <= 5 ? 26 : 16)}</div>`,
      `${n} files de ${n} quadrets: ${n} × ${n} = ${fmt(v)}`);
  }
  const t = Math.floor(n / 10) * 10, u = n % 10, a = t / 10;
  if (u === 0) {
    return fig(`<div class="vz-blocks" style="grid-template-columns:repeat(${a},56px)">${'<b>100</b>'.repeat(a * a)}</div>`,
      `${a} × ${a} = ${a * a} blocs de 10 × 10 → ${a * a} × 100 = ${fmt(v)}`);
  }
  const W = 290, H = 140, x0 = 34, y0 = 28, wB = Math.max(78, W * u / n), wA = W - wB;
  const svg = `<svg class="vz-svg" viewBox="0 0 ${x0 + W + 4} ${y0 + H + 4}">
    <text x="${x0 + wA / 2}" y="14">${t}</text><text x="${x0 + wA + wB / 2}" y="14">${u}</text>
    <text x="15" y="${y0 + H / 2}">${n}</text>
    <rect class="ra" x="${x0}" y="${y0}" width="${wA}" height="${H}" rx="4"/>
    <rect class="rb" x="${x0 + wA}" y="${y0}" width="${wB}" height="${H}" rx="4"/>
    <text x="${x0 + wA / 2}" y="${y0 + H / 2 - 12}">${n} × ${t}</text><text class="tb" x="${x0 + wA / 2}" y="${y0 + H / 2 + 14}">${fmt(n * t)}</text>
    <text class="s" x="${x0 + wA + wB / 2}" y="${y0 + H / 2 - 12}">${n} × ${u}</text><text class="tb" x="${x0 + wA + wB / 2}" y="${y0 + H / 2 + 14}">${fmt(n * u)}</text>
  </svg>`;
  let cap = `Un quadrat de ${n} × ${n} partit en dues parts: ${fmt(n * t)} + ${fmt(n * u)} = ${fmt(v)}`;
  if (u === 5) cap += `. Truc: ${a} × ${a + 1} = ${a * (a + 1)} i hi enganxes 25`;
  return fig(svg, cap);
}
const SQ_DIG = { 0: [0], 1: [1, 9], 4: [2, 8], 5: [5], 6: [4, 6], 9: [3, 7] };
function sqInvViz(n) {
  if (n <= 10 || n % 10 === 0) return sqViz(n);
  const v = n * n, lo = Math.floor(n / 10) * 10, hi = lo + 10, a = lo * lo, b = hi * hi;
  const x = p => 30 + (p - a) / (b - a) * 270;
  const svg = `<svg class="vz-svg" viewBox="0 0 330 86">
    <line class="ax" x1="30" y1="44" x2="300" y2="44"/>
    <line class="ax" x1="30" y1="36" x2="30" y2="52"/><line class="ax" x1="300" y1="36" x2="300" y2="52"/>
    <text x="30" y="22">${fmt(a)}</text><text class="s" x="30" y="68">${lo}²</text>
    <text x="300" y="22">${fmt(b)}</text><text class="s" x="300" y="68">${hi}²</text>
    <circle class="mk" cx="${x(v)}" cy="44" r="8"/><text class="tb" x="${x(v)}" y="20">${fmt(v)}</text>
  </svg>`;
  const cands = SQ_DIG[v % 10].map(d => lo + d);
  const chips = cands.map(c => chip(`${c}² = ${fmt(c * c)} ${c === n ? '✓' : '✗'}`, c === n ? 'on' : 'ko')).join('');
  return fig(`${svg}<div class="vz-chips"><span class="vz-note">Acaba en ${dgd(v % 10, 'last')}: prova</span>${chips}</div>`,
    `${fmt(v)} és entre ${lo}² i ${hi}², per tant el nombre és entre ${lo} i ${hi}`);
}

// --- Cubs ---
function isoCube(n) {
  const L = 110, cx = Math.cos(Math.PI / 6) * L, sy = L / 2;
  const P0 = [120, 238], ex = [cx, -sy], ey = [-cx, -sy], ez = [0, -L];
  const add = (...v) => v.reduce((p, q) => [p[0] + q[0], p[1] + q[1]]);
  const mul = (v, k) => [v[0] * k, v[1] * k];
  const pt = p => p.map(c => c.toFixed(1)).join(',');
  const poly = (ps, cls) => `<polygon class="fc ${cls}" points="${ps.map(pt).join(' ')}"/>`;

function boxes(n, mode, plus) {
  const ds = digitsOf(n), L = ds.length;
  return `<div class="vz-boxes${mode === 'alt' ? ' alt' : ''}">${ds.map((x, i) => {
    const idx = L - 1 - i; let cls = '';
    if (mode === 'last1' && idx === 0) cls = 'last';
    else if (mode === 'last2' && idx < 2) cls = 'last';
    else if (mode === 'alt') cls = idx % 2 === 0 ? 'odd' : 'even';
    const lab = mode === 'alt' ? `<small>${idx % 2 === 0 ? 'senar' : 'parell'}</small>` : '';
    return (plus && i ? '<em>+</em>' : '') + `<span class="vz-box ${cls}">${lab}${x}</span>`;
  }).join('')}</div>`;
}
const setChips = (set, v) => `<div class="vz-chips">${set.map(s => chip(s, s === v ? 'on' : '')).join('')}</div>`;
function multChips(d, v) {
  const arr = []; for (let m = Math.max(0, Math.floor(v / d) * d - 2 * d); arr.length < 5; m += d) arr.push(m);
  if (!arr.includes(v)) { arr.push(v); arr.sort((x, y) => x - y); }
  return `<div class="vz-chips"><span class="vz-note">Múltiples ${d === 11 ? 'd’11' : `de ${d}`}:</span>${arr.map(m => chip(m, m === v ? (m % d === 0 ? 'on' : 'ko') : '')).join('')}</div>`;
}
const sumLine = n => { const ds = digitsOf(n); return `<div class="vz-line">${boxes(n, null, true)}<em>=</em><span class="vz-sum">${sum(ds)}</span></div>`; };
function divViz(n, d, yes) {
  const ds = digitsOf(n), last = ds[ds.length - 1], s = sum(ds);
  let body = '';
  const lastSet = { 2: [0, 2, 4, 6, 8], 5: [0, 5], 10: [0] };
  if (d === 2 || d === 5 || d === 10) {
    body = `${boxes(n, 'last1')}<div class="vz-lab">L’última xifra ha de ser ${d === 10 ? 'un 0' : 'una d’aquestes'}:</div>${setChips(lastSet[d], last)}`;
  } else if (d === 3 || d === 9) {
    body = sumLine(n) + multChips(d, s);
  } else if (d === 4) {
    const two = n % 100;
    body = `${boxes(n, 'last2')}<div class="vz-lab">Les dues últimes xifres formen el ${two}</div>${multChips(4, two)}`;
  } else if (d === 6) {
    body = `<div class="vz-sub"><b>Per 2 ${last % 2 === 0 ? '✓' : '✗'}</b>${boxes(n, 'last1')}${setChips(lastSet[2], last)}</div>
      <div class="vz-sub"><b>Per 3 ${s % 3 === 0 ? '✓' : '✗'}</b>${sumLine(n)}${multChips(3, s)}</div>`;
  } else if (d === 11) {
    const r = ds.slice().reverse();
    const A = sum(r.filter((_, i) => i % 2 === 0)), B = sum(r.filter((_, i) => i % 2 === 1)), D = Math.abs(A - B);
    body = `${boxes(n, 'alt')}<div class="vz-chips"><span class="vz-pill odd">Senar: ${A}</span><span class="vz-pill even">Parell: ${B}</span><span class="vz-pill">${Math.max(A, B)} − ${Math.min(A, B)} = ${D}</span></div>${multChips(11, D)}`;
  }
  return fig(body, `${yes ? '✓' : '✗'} ${fmt(n)} ${yes ? 'sí' : 'no'} és divisible per ${d}`);
}

// --- Quadrats ---
function sqExplain(n) {
  const v = n * n;
  if (n === 1) return '1² = 1 × 1 = 1.';
  if (n <= 10) return `${n}² = ${n} × ${n} = ${fmt(v)}. És a la taula del ${n}.`;
  const t = Math.floor(n / 10) * 10, u = n % 10, a = t / 10;
  if (u === 0) return `${n}² = ${n} × ${n} = ${fmt(v)}. Truc: ${a} × ${a} = ${a * a} i hi afegeixes dos zeros.`;
  let s = `${n}² = ${n} × ${n}. Descompon: ${n} × ${t} + ${n} × ${u} = ${fmt(n * t)} + ${fmt(n * u)} = ${fmt(v)}.`;
  if (u === 5) s += ` Truc dels acabats en 5: ${a} × ${a + 1} = ${a * (a + 1)} i hi enganxes 25 → ${fmt(v)}.`;
  return s;
}
const SQ_END = { 0: '0', 1: '1 o en 9', 4: '2 o en 8', 5: '5', 6: '4 o en 6', 9: '3 o en 7' };
function sqInvExplain(n) {
  const v = n * n, last = v % 10;
  let s = `${n} × ${n} = ${fmt(v)}, per tant el nombre és ${n}.`;
  if (n > 10 && n % 10 !== 0) {
    const lo = Math.floor(n / 10) * 10, hi = lo + 10;
    s += ` Pista: ${fmt(v)} és entre ${fmt(lo * lo)} (${lo}²) i ${fmt(hi * hi)} (${hi}²), i acaba en ${last}, així que el nombre ha d’acabar en ${SQ_END[last]}.`;
  } else if (n % 10 === 0 && n > 10) {
    s += ` Pista: si el quadrat acaba en 00, treu els dos zeros: ${n / 10}² = ${(n / 10) ** 2}.`;
  }
  return s;
}

// --- Cubs ---
function cubeExplain(n) {
  const c = n ** 3;
  if (n === 1) return '1³ = 1 × 1 × 1 = 1.';
  return `${n}³ = ${n} × ${n} × ${n} = ${fmt(n * n)} × ${n} = ${fmt(c)}.`;
}
function cubeInvExplain(n) {
  const c = n ** 3;
  return `${n} × ${n} × ${n} = ${fmt(c)}, per tant el nombre és ${n}. Pista: ${fmt(c)} acaba en ${c % 10}, i dels cubs de l’1 al 10 només ${n}³ acaba en ${c % 10}.`;
}

// --- Primers ---
function primeReason(n, p) {
  const ds = digitsOf(n), last = ds[ds.length - 1];
  if (p === 2) return `acaba en ${last}, que és parell, i per tant és divisible per 2`;
  if (p === 3) return `les xifres sumen ${sumStr(ds)}, que és múltiple de 3, i per tant és divisible per 3`;
  if (p === 5) return `acaba en 5, i per tant és divisible per 5`;
  return `és divisible per ${p}`;
}
function primeExplain(n) {
  if (n === 1) return 'L’1 no és primer: un nombre primer té exactament dos divisors (l’1 i ell mateix) i l’1 només en té un.';
  if (n === 2) return 'El 2 és primer: només té dos divisors, l’1 i el 2. És l’únic nombre primer parell.';
  if (n === 3) return 'El 3 és primer: només té dos divisors, l’1 i el 3.';
  if (isPrime(n)) {
    const tested = [2, 3, 5, 7].filter(p => p * p <= n);
    const next = [3, 5, 7, 11].find(p => p * p > n);
    return `${Art(n)} és primer: no és divisible per ${listNi(tested)}. No cal provar res més, perquè ${next} × ${next} = ${next * next} ja és més gran que ${n}.`;
  }
  const p = smallestFactor(n);
  return `${Art(n)} no és primer: ${primeReason(n, p)} (${n} = ${p} × ${n / p}). Té més de dos divisors.`;
}

// --- Divisibilitat: aplica el criteri (no fa servir la divisió) ---
function divCheck(n, d) {
  const ds = digitsOf(n), last = ds[ds.length - 1], s = sum(ds);
  let yes, text;
  const end = y => `${fmt(n)} ${y ? 'sí' : 'no'} és divisible per ${d}.`;
  switch (d) {
    case 2: yes = last % 2 === 0;
      text = `Mira l’última xifra de ${dg(n, 'last1')}: ${dgd(last, 'last')}. ${yes ? 'És parella' : 'És senar'} → ${end(yes)}`; break;
    case 3: yes = s % 3 === 0;
      text = `Suma les xifres: ${sumStr(ds)}. ${s} ${yes ? 'és' : 'no és'} múltiple de 3 → ${end(yes)}`; break;
    case 4: {
      const two = n % 100; yes = two % 4 === 0;
      text = two === 0
        ? `${dg(n, 'last2')} acaba en 00, i un nombre acabat en 00 sempre és divisible per 4 → ${end(yes)}`
        : `Mira les dues últimes xifres de ${dg(n, 'last2')}: formen el ${dgd(two, 'last')}. ${two} ${yes ? 'és' : 'no és'} múltiple de 4 → ${end(yes)}`;
      break;
    }
    case 5: yes = last === 0 || last === 5;
      text = `${dg(n, 'last1')} acaba en ${dgd(last, 'last')}. Per ser divisible per 5 ha d’acabar en 0 o en 5 → ${end(yes)}`; break;
    case 6: {
      const a = last % 2 === 0, b = s % 3 === 0; yes = a && b;
      text = `Ha de ser divisible per 2 i per 3 alhora. Per 2: ${dg(n, 'last1')} acaba en ${dgd(last, 'last')}, ${a ? 'parell ✓' : 'senar ✗'}. Per 3: ${sumStr(ds)}, ${b ? 'múltiple de 3 ✓' : 'no és múltiple de 3 ✗'} → ${end(yes)}`;
      break;
    }
    case 9: yes = s % 9 === 0;
      text = `Suma les xifres: ${sumStr(ds)}. ${s} ${yes ? 'és' : 'no és'} múltiple de 9 → ${end(yes)}`; break;
    case 10: yes = last === 0;
      text = `${dg(n, 'last1')} acaba en ${dgd(last, 'last')}. Per ser divisible per 10 ha d’acabar en 0 → ${end(yes)}`; break;
    case 11: {
      const r = ds.slice().reverse();
      const odd = r.filter((_, i) => i % 2 === 0), even = r.filter((_, i) => i % 2 === 1);
      const A = sum(odd), B = sum(even), D = Math.abs(A - B);
      yes = D % 11 === 0;
      const verdict = D === 0 ? 'És 0' : (yes ? 'És múltiple d’11' : 'No és 0 ni múltiple d’11');
      text = `Comença per la dreta: ${dg(n, 'alt')}. Xifres de lloc senar: ${colSum(odd, 'odd')}. Xifres de lloc parell: ${colSum(even, 'even')}. Diferència: ${Math.max(A, B)} − ${Math.min(A, B)} = ${D}. ${verdict} → ${end(yes)}`;
      break;
    }
  }
  return { yes, text, viz: divViz(n, d, yes) };
}

function genCube() {

function genPrime() {
  if (Math.random() < 0.7) {
    let n; const r = Math.random();
    if (r < 0.45) n = pick(PRIMES);
    else if (r < 0.8) n = pick(TRICKY);
    else if (r < 0.85) n = 1;
    else { do n = rnd(4, 100); while (isPrime(n)); }
    return { key: 'p' + n, kind: 'bool', promptHTML: `${n}`, promptText: `${n}`, sub: `És primer ${art(n)}?`, answer: isPrime(n), explain: primeExplain(n), viz: primeViz(n) };
  }
  const p = pick(PRIMES.filter(x => x > 10));
  const others = shuffle(TRICKY).slice(0, 3);
  const options = shuffle([p, ...others]);
  const rest = others.map(o => { const f = smallestFactor(o); return `${o} = ${f} × ${o / f}`; }).join('; ');
  return { key: 'pc' + p, kind: 'choice', promptHTML: 'Quin és primer?', promptText: 'Quin d’aquests nombres és primer?', sub: 'Només un d’aquests nombres és primer.', options, answer: p,
    explain: `${primeExplain(p)} Els altres no ho són: ${rest}.`, viz: choiceViz(p, others) };
}
function genDiv(ds) {
  const d = pick(ds), yes = Math.random() < 0.5;
  let n;
  if (yes) n = d * rnd(Math.ceil(100 / d), Math.floor(9999 / d));

}

function vQuiz() {
  const qz = S.quiz, q = qz.q, m = MODS[S.mod];

  const train = qz.mode === 'train';
  const num = Math.min(qz.results.length + (qz.answered ? 0 : 1), qz.total);
  const left = Math.max(0, Math.ceil((qz.endAt - Date.now()) / 1000));
  const head = `<div class="qhead"><button class="back" data-act="quit">‹ Surt</button>
      <span class="count" id="count">${train ? `Pregunta ${num} de ${qz.total}` : `Temps: <span id="tleft">${left}</span> s &nbsp; Encerts: ${ok}`}</span></div>
    <div class="bar${train ? '' : ' time'}"><i id="tbar" style="width:${train ? (qz.results.length / qz.total) * 100 : (qz.endAt - Date.now()) / SPRINT_MS * 100}%"></i></div>`;

  let area = '';
  const last = qz.results[qz.results.length - 1];
  if (!(train && qz.answered)) {
    const dis = qz.answered ? ' disabled' : '';
    if (q.kind === 'num') {
      area = `<div class="display${qz.input ? '' : ' empty'}${qz.answered && !qz.lastOk ? ' shake' : ''}" id="disp" aria-label="La teva resposta">${qz.input ? fmt(qz.input) : ''}</div>

          <button class="key" style="grid-column:span 2" data-act="key" data-k="0"${dis}>0</button>
          <button class="key del" data-act="del" aria-label="Esborra l’última xifra"${dis}>⌫</button>
          <button class="key go" data-act="go"${dis}>Comprova</button></div>`;
    } else if (q.kind === 'bool') {
      area = `<div class="yn"><button class="key" data-act="yn" data-v="1"${dis}>Sí</button><button class="key" data-act="yn" data-v="0"${dis}>No</button></div>`;
    } else {
      area = `<div class="opts">${q.options.map(o => `<button class="key" data-act="opt" data-v="${o}"${dis}>${o}</button>`).join('')}</div>`;
    }
    if (!train && qz.answered) {
      area += `<div class="flash ${qz.lastOk ? 'ok' : 'ko'}" role="status">${qz.lastOk ? '✓ Correcte' : `✗ La resposta era ${show(q, q.answer)}`}</div>`;
    }
  }

  let fb = '';
  if (train && qz.answered) {
    const isLast = qz.results.length >= qz.total;
    fb = `<div class="fb ${qz.lastOk ? 'ok' : 'ko'}" role="status">
      <h3><span class="mark" aria-hidden="true">${qz.lastOk ? '✓' : '✗'}</span>${qz.lastOk ? qz.praise : 'No és correcte'}</h3>
      ${qz.lastOk ? '' : `<p class="ans">Has respost ${show(q, last.given)}. La resposta correcta és ${show(q, q.answer)}.</p>`}
      <p class="ex">${q.explain}</p>${q.viz || ''}
      <button class="btn primary" id="nextBtn" data-act="next">${isLast ? 'Mostra els resultats' : 'Següent pregunta'}</button>
    </div>`;
  }

  return `<div class="wrap" style="${accStyle(S.mod)}">${head}
    <div class="qcard"><p class="qsub">${q.sub}</p>
      <div class="qbig${q.kind === 'choice' ? ' text' : ''}">${q.hl && qz.answered ? dg(q.n, q.hl) : q.promptHTML}</div>
      ${area}${fb}
    </div><p class="sr" aria-live="polite">${q.promptText}. ${q.sub}</p></div>`;
}

function vSummary() {

// ---------- Pràctica ----------
function makeQ() {
  if (S.mod === 'quadrats') { const [a, b] = RANGES[S.sqRange]; return genSquare(a, b); }
  if (S.mod === 'cubs') return genCube();
  if (S.mod === 'primers') return genPrime();
  return genDiv(S.divSel);
}
function newQ() {
  const qz = S.quiz; let q, t = 0;
  do { q = makeQ(); t++; } while (qz.recent.includes(q.key) && t < 40);
  qz.recent.push(q.key); if (qz.recent.length > 6) qz.recent.shift();
  Object.assign(qz, { q, input: '', answered: false, lastOk: null });
}
function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
function startQuiz() {
  stopTimer();
  const sprint = S.mode === 'sprint';
  S.quiz = { mode: S.mode, total: sprint ? Infinity : 10, results: [], recent: [], start: Date.now(), endAt: sprint ? Date.now() + SPRINT_MS : null };
  newQ(); S.screen = 'quiz'; render(); window.scrollTo(0, 0);
  if (sprint) timer = setInterval(tick, 200);
}
function tick() {
  const qz = S.quiz; if (!qz || S.screen !== 'quiz') return stopTimer();
  const ms = qz.endAt - Date.now();
  if (ms <= 0) return finish();
  const b = document.getElementById('tbar'), t = document.getElementById('tleft');
  if (b) b.style.width = (ms / SPRINT_MS * 100) + '%';
  if (t) t.textContent = Math.ceil(ms / 1000);
}
function finish() { stopTimer(); S.quiz.end = S.quiz.mode === 'sprint' ? S.quiz.endAt : Date.now(); S.screen = 'summary'; render(); window.scrollTo(0, 0); }
function answer(given) {
  const qz = S.quiz; if (!qz || qz.answered) return;
  const ok = given === qz.q.answer;
  qz.results.push({ q: qz.q, given, correct: ok });
  qz.answered = true; qz.lastOk = ok; qz.praise = pick(PRAISE);
  render();
  if (qz.mode === 'sprint') {
    setTimeout(() => {
      if (S.screen !== 'quiz' || S.quiz !== qz) return;
      if (Date.now() >= qz.endAt) return finish();
      newQ(); render();
    }, ok ? 450 : 1400);
  }
}
function next() {
  const qz = S.quiz; if (!qz || !qz.answered) return;
  if (qz.results.length >= qz.total) return finish();
  newQ(); render();
}
function updateDisplay() {
  const d = document.getElementById('disp'), m = document.getElementById('msg');
  if (d) { d.textContent = S.quiz.input ? fmt(S.quiz.input) : ''; d.classList.toggle('empty', !S.quiz.input); d.classList.remove('shake'); }
  if (m) m.textContent = '';
}
function typeKey(k) {
  const qz = S.quiz; if (qz.answered || qz.input.length >= 5) return;
  qz.input = qz.input === '0' ? k : qz.input + k; updateDisplay();
}
function del() { const qz = S.quiz; if (qz.answered) return; qz.input = qz.input.slice(0, -1); updateDisplay(); }
function go() {
  const qz = S.quiz; if (qz.answered) return;
  if (!qz.input) {
    const m = document.getElementById('msg'), d = document.getElementById('disp');
    if (m) m.textContent = 'Escriu una resposta abans de comprovar-la.';
    if (d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
    return;
  }
  answer(Number(qz.input));
}

// ---------- Accions ----------
function divTest() {
  const el = document.getElementById('divIn'); const raw = (el ? el.value : '').trim();
  S.divInput = raw; S.divRes = null; S.divErr = '';
  const clean = raw.replace(/[.\s]/g, '');
  if (!clean) S.divErr = 'Escriu un nombre per poder-lo comprovar.';
  else if (!/^\d+$/.test(clean)) S.divErr = 'Fes servir només xifres. Pots separar els milers amb un punt, però no amb comes ni lletres.';
  else {
    const n = Number(clean);
    if (n < 1 || n > 999999) S.divErr = 'Escriu un nombre entre 1 i 999.999.';
    else { S.divInput = fmt(n); S.divRes = DIVISORS.map(d => [d, divCheck(n, d)]); }
  }
  render();
  const i = document.getElementById('divIn'); if (i && S.divErr) i.focus();
}

function handle(b) {
  const a = b.dataset.act;
  if (paperAction(a, b)) return;
  switch (a) {
    case 'open': S.mod = b.dataset.m; S.tab = 'learn'; S.screen = 'mod'; S.primeHide = false; S.divRes = null; S.divErr = ''; S.divInput = ''; S.practiceMsg = ''; render(); window.scrollTo(0, 0); break;
    case 'home': stopTimer(); S.screen = 'home'; render(); window.scrollTo(0, 0); break;
    case 'tab': S.tab = b.dataset.t; S.practiceMsg = ''; render(); break;
    case 'range': S.sqRange = b.dataset.r; render(); break;
    case 'flip': b.classList.toggle('on'); break;
    case 'showall': app.querySelectorAll('.card').forEach(c => c.classList.add('on')); break;
    case 'hideall': app.querySelectorAll('.card').forEach(c => c.classList.remove('on')); break;
    case 'primeToggle': S.primeHide = !S.primeHide; render(); break;
    case 'prime': {
      const n = Number(b.dataset.n);
      app.querySelectorAll('.pn.sel').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      const info = document.getElementById('pinfo');
      if (S.primeHide) {
        b.classList.add(isPrime(n) ? 'prime' : 'comp-shown');
        const found = app.querySelectorAll('.pn.prime').length;
        info.innerHTML = `${primeExplain(n)}${primeViz(n)}<span class="muted">Has descobert <b>${found}</b> de 25 primers.</span>`;
      } else info.innerHTML = primeExplain(n) + primeViz(n);
      break;
    }
    case 'divTest': divTest(); break;
    case 'speak': {
      if (!VOICE || !DEF[S.mod]) break;
      if (speechSynthesis.speaking) { speechSynthesis.cancel(); break; }
      const u = new SpeechSynthesisUtterance(DEF[S.mod].say); u.voice = VOICE; u.lang = VOICE.lang; u.rate = 0.9;
      speechSynthesis.speak(u); break;
    }
    case 'divSel': {
      const d = Number(b.dataset.d);
      if (S.divSel.includes(d)) {
        if (S.divSel.length === 1) { S.practiceMsg = 'Has de deixar com a mínim un criteri seleccionat.'; render(); return; }
        S.divSel = S.divSel.filter(x => x !== d);
      } else S.divSel = [...S.divSel, d].sort((x, y) => x - y);
      S.practiceMsg = ''; render(); break;
    }
    case 'mode': S.mode = b.dataset.m; render(); break;
    case 'start': startQuiz(); break;
    case 'key': typeKey(b.dataset.k); break;
    case 'del': del(); break;
    case 'go': go(); break;
    case 'yn': answer(b.dataset.v === '1'); break;
    case 'opt': answer(Number(b.dataset.v)); break;
    case 'next': next(); break;
    case 'quit': case 'tomod': stopTimer(); S.screen = 'mod'; S.tab = 'practice'; render(); window.scrollTo(0, 0); break;
  }
}

const SHEET_N = 12;
const MOD_L = { quadrats: 'Q', cubs: 'C', primers: 'P', divisibilitat: 'D' };
const L_MOD = { Q: 'quadrats', C: 'cubs', P: 'primers', D: 'divisibilitat' };
const RKEYS = Object.keys(RANGES);
const CAP = { sample: null, img: null, dl: null };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const listI = a => a.length === 1 ? String(a[0]) : a.slice(0, -1).join(', ') + ' i ' + a[a.length - 1];

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

function makeCode(mod) {
  let opt = '0';
  if (mod === 'quadrats') opt = String(RKEYS.indexOf(S.sqRange));
  if (mod === 'divisibilitat') opt = DIVISORS.reduce((m, d, i) => S.divSel.includes(d) ? m | (1 << i) : m, 0).toString(16).toUpperCase().padStart(2, '0');
  return `${MOD_L[mod]}${opt}-${1000 + Math.floor(Math.random() * 9000)}`;
}
function parseCode(raw) {
  const c = String(raw || '').toUpperCase().replace(/[\s–—]/g, '').replace(/^([QCPD][0-9A-F]{1,2})(\d{4})$/, '$1-$2');
  const m = c.match(/^([QCPD])([0-9A-F]{1,2})-(\d{4})$/);
  if (!m) return null;
  const mod = L_MOD[m[1]];
  let gen;
  if (mod === 'quadrats') {
    if (m[2].length !== 1 || !(Number(m[2]) < RKEYS.length)) return null;
    const [a, b] = RANGES[RKEYS[Number(m[2])]]; gen = () => genSquare(a, b);
  } else if (mod === 'cubs') { if (m[2] !== '0') return null; gen = genCube; }
  else if (mod === 'primers') { if (m[2] !== '0') return null; gen = genPrime; }
  else {
    if (m[2].length !== 2) return null;
    const mask = parseInt(m[2], 16), ds = DIVISORS.filter((_, i) => mask & (1 << i));
    if (!ds.length || mask >= 1 << DIVISORS.length) return null;
    gen = () => genDiv(ds);
  }
  return { code: c, mod, gen };
}
// El mateix codi genera sempre les mateixes preguntes
function genSheet(parsed) {
  const rand = Math.random; Math.random = mulberry32(hashStr(parsed.code));
  try {
    const qs = [], keys = new Set(); let t = 0;
    while (qs.length < SHEET_N && t < 400) { const q = parsed.gen(); t++; if (keys.has(q.key) && t < 300) continue; keys.add(q.key); qs.push(q); }
    return qs;
  } finally { Math.random = rand; }
}
function newPaper(parsed, view) {
  S.mod = parsed.mod;
  S.paper = { code: parsed.code, mod: parsed.mod, qs: genSheet(parsed), answers: Array(SHEET_N).fill(''), unread: [], fromPhoto: false,
    view, err: '', confirmBlank: false, result: null, dlMsg: '', photo: { file: null, url: '', ok: false, busy: false, msg: '', ctl: null } };
}

function normAnswer(q, v) {
  if (v === null || v === undefined) return '';
  const s = String(v).trim();
  if (q.kind === 'bool') return /^s/i.test(s) ? 'Sí' : /^n/i.test(s) ? 'No' : '';
  return s.replace(/\D/g, '').slice(0, 6);
}
function photoErr(code) {
  switch (code) {
    case 'cancelled': return '';
    case 'not_granted': case 'sampling_disabled': case 'not_declared': case 'capability_disabled': case 'capability_removed': case 'images_unavailable':
      return 'La lectura de fotos no està disponible amb aquest compte. Pots escriure les respostes a mà.';
    case 'rate_limited': return 'Ara mateix hi ha massa peticions. Torna-ho a provar d’aquí a una estona.';
    case 'session_expired': return 'Cal tornar a iniciar la sessió a Claude per llegir la foto.';
    case 'image_rejected': return 'No s’ha pogut fer servir aquesta imatge. Prova amb una altra foto en JPG o PNG.';
    case 'invalid_json': case 'empty_completion': case 'refused':
      return 'No s’han pogut llegir les respostes. Prova amb una foto més nítida, amb tota la fitxa dins i sense ombres.';
    default: return 'Hi ha hagut un problema de connexió. Torna-ho a provar.';
  }
}
function shrink(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2000 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej({ code: 'image_rejected' }), 'image/jpeg', 0.88);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej({ code: 'image_rejected' }); };
    img.src = url;
  });
}
async function readPhoto() {

  ph.busy = true; ph.msg = 'Llegint la foto… Pot trigar fins a un minut.'; render();
  ph.ctl = new AbortController();
  try {

    if (img.size > CAP.img.maxInputBytes || (CAP.img.mediaTypes && !CAP.img.mediaTypes.includes(img.type))) img = await shrink(img);

    const prompt = `Aquesta imatge és la foto d’una fitxa de càlcul mental de primària (codi ${P.code}). Té ${P.qs.length} preguntes numerades de l’1 al ${P.qs.length}, i cada una té una casella on hi ha la resposta escrita a mà.
La teva única tasca és TRANSCRIURE el que hi ha escrit a cada casella. No corregeixis, no calculis i no completis res: si una resposta sembla incorrecta, transcriu-la igualment tal com està escrita.

${list}
Normes:
- Per a les respostes numèriques, escriu només les xifres, sense punts ni espais.
- Per a les de Sí o No, escriu "Sí" o "No".
- Si una casella és buida, està ratllada de manera confusa o no es pot llegir amb seguretat, posa null.
- No transcriguis cap nom ni cap altra informació que aparegui a la foto.
Respon només amb JSON amb aquest format:
{"respostes":[{"n":1,"valor":"529"},{"n":2,"valor":null}]}`;
    const r = await CAP.sample.json(prompt, { images: [img], signal: ph.ctl.signal, cache: false });
    const arr = r && Array.isArray(r.respostes) ? r.respostes : [];
    P.answers = P.qs.map(() => ''); P.unread = P.qs.map(() => true);
    for (const it of arr) {
      const i = Number(it && it.n) - 1;

    render(); window.scrollTo(0, 0);
  } catch (e) { ph.busy = false; ph.msg = photoErr(e && e.code); render(); }
}

    case 'paperSheet': P.view = 'sheet'; P.err = ''; render(); return true;
    case 'paperType': P.view = 'type'; P.err = ''; P.confirmBlank = false; render(); window.scrollTo(0, 0); return true;
    case 'paperPhoto': P.view = 'photo'; P.photo.msg = ''; render(); window.scrollTo(0, 0); return true;
    case 'paperDl': downloadSheet(); return true;
    case 'paperPrint': {
      const win = window.open('', '_blank');
      if (!win) { P.dlMsg = 'El navegador ha bloquejat la finestra d’impressió. Permet les finestres emergents per a aquesta pàgina o fes servir «Descarrega-la».'; render(); return true; }
      win.document.write(sheetHTML(P).replace('</body>', '<script>window.onload = () => setTimeout(() => window.print(), 300);<\/script></body>'));
      win.document.close(); P.dlMsg = ''; render(); return true;
    }
    case 'paperRead': readPhoto(); return true;
    case 'paperStop': if (P.photo.ctl) P.photo.ctl.abort(); return true;
    case 'paperCheck': paperCheck(); return true;
    case 'pbool': P.answers[Number(b.dataset.i)] = b.dataset.v; P.confirmBlank = false; P.err = '';
      b.parentNode.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b))); return true;
    case 'paperBack': if (P && P.photo && P.photo.ctl) P.photo.ctl.abort(); S.screen = 'mod'; S.tab = 'practice'; render(); window.scrollTo(0, 0); return true;
  }
  return false;
}
app.addEventListener('input', e => {
  const i = e.target.dataset && e.target.dataset.ans;
  if (i === undefined || !S.paper) return;
  const v = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (v !== e.target.value) e.target.value = v;
  S.paper.answers[Number(i)] = v; S.paper.confirmBlank = false;
});
app.addEventListener('change', e => {
  const P = S.paper; if (!P || !P.photo) return;
  if (e.target.id === 'photoOk') { P.photo.ok = e.target.checked; render(); }
  if (e.target.id === 'photoIn' && e.target.files && e.target.files[0]) {
    if (P.photo.url) URL.revokeObjectURL(P.photo.url);
    P.photo.file = e.target.files[0]; P.photo.url = URL.createObjectURL(P.photo.file); P.photo.msg = ''; render();
  }
});
app.addEventListener('keydown', e => { if (e.target.id === 'codeIn' && e.key === 'Enter') { e.preventDefault(); paperAction('paperOpen'); } });
(async () => {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [dl, sample] = await Promise.all([window.claude.use('downloads').catch(() => null), window.claude.use('sample').catch(() => null)]);
    CAP.dl = dl;
    if (sample) { CAP.sample = sample; const l = await sample.limits().catch(() => null); CAP.img = l && l.images ? l.images : null; }
    if (S.screen === 'paper') render();
  } catch (e) { /* sense capacitats: es mostren només les opcions sense descàrrega ni foto */ }
})();

// Lectura en veu alta: el botó només apareix si el dispositiu té una veu en català
function findVoice() {
  try {
    if (!('speechSynthesis' in window) || VOICE) return;
    const v = speechSynthesis.getVoices().find(x => /^ca(-|_|$)/i.test(x.lang));
    if (v) { VOICE = v; if (S.screen === 'mod' && S.tab === 'learn' && DEF[S.mod]) render(); }
  } catch (e) { /* sense veu: no es mostra el botó */ }
}
if ('speechSynthesis' in window) { findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
// Evita que els botons del teclat numèric es quedin amb el focus (així la tecla Retorn sempre comprova)
app.addEventListener('mousedown', e => { if (e.target.closest('.key')) e.preventDefault(); });
app.addEventListener('keydown', e => { if (e.target.id === 'divIn' && e.key === 'Enter') { e.preventDefault(); divTest(); } });
document.addEventListener('keydown', e => {
  if (S.screen !== 'quiz' || !S.quiz) return;
  if (e.target.tagName === 'INPUT') return;
  const qz = S.quiz, q = qz.q;
  if (qz.answered) {
    if (e.key === 'Enter' && qz.mode === 'train' && !e.target.closest('button')) { e.preventDefault(); next(); }
    return;
  }
  if (q.kind === 'num') {
    if (/^[0-9]$/.test(e.key)) typeKey(e.key);
    else if (e.key === 'Backspace') { e.preventDefault(); del(); }
    else if (e.key === 'Enter') { e.preventDefault(); go(); }
  } else if (q.kind === 'bool') {
    if (e.key === 's' || e.key === 'S') answer(true);
    else if (e.key === 'n' || e.key === 'N') answer(false);
  } else {
    const i = Number(e.key) - 1; if (i >= 0 && i < q.options.length) answer(q.options[i]);
  }
});

render();

</script>
